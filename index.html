<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạp Hóa Hường Quyền</title>
    <link rel="icon" type="image/png" href="images/logoHQ.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <style>
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      .splash-logo {
        width: 80px;
        height: auto;
      }
      .product-grid {
        display: grid;

        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 1rem;
        overflow-y: auto;
        padding: 10px;
        flex-grow: 1;
      }

      .product-card {
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.955);
        border-radius: 0.75rem;
        border: 1px solid #e5e7eb;
        overflow: hidden;
        transition: all 0.2s;
        height: 180px;
      }

      .product-image {
        width: 100%;
        height: 90px;
        object-fit: cover;
      }

      .card-title {
        font-size: 0.85rem;
        line-height: 1.1rem;
        height: 3.8rem;
        font-weight: 600;
        color: #1f2937;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        padding: 3px 10px;
        text-align: center;
      }

      .card-price {
        font-size: 0.9rem;
        font-weight: 800;
        color: #ef9504;
        text-align: center;
        margin-top: auto;
        padding-bottom: 8px;
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body class="bg-gray-100 font-sans overflow-hidden">
    <div id="splash-screen">
      <img src="images/logoHQ.png" alt="Logo" class="splash-logo" />
    </div>
    <div class="flex h-screen">
      <div class="w-7/12 p-5 flex flex-col border-r bg-white">
        <div class="flex items-center gap-4 mb-4 pb-3 border-b border-gray-100">
          <div
            class="w-14 h-14 bg-pink-700 rounded-full flex items-center justify-center text-2xl shadow-lg text-white font-bold border-2 border-blue-200"
          >
            <img src="images/logoHQ.png" alt="Logo" class="splash-logo" />
          </div>
          <div>
            <h2 class="text-2 font-black text-red-800 uppercase tracking-tight">
              Tạp Hóa Hường Quyền
            </h2>
          </div>
        </div>

        <div class="mb-6 flex-shrink-0 relative z-10">
          <input
            type="text"
            id="searchInput"
            oninput="handleSearch()"
            placeholder="Gõ tên sản phẩm để tìm nhanh..."
            class="w-full p-3 border-2 border-gray-100 rounded-xl shadow-lg focus:border-blue-500 outline-none transition-all text-gray-700 font-medium bg-white"
          />
        </div>

        <div
          class="flex gap-2 mb-4 overflow-x-auto pb-2 items-center scrollbar-hide"
        >
          <button
            onclick="filterCategory('All')"
            class="category-btn px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-lg shadow whitespace-nowrap"
          >
            Tất cả
          </button>
          <button
            onclick="filterCategory('Bánh kẹo')"
            class="category-btn px-4 py-2 bg-gray-100 text-gray-600 text-xs font-bold rounded-lg hover:bg-blue-50 transition whitespace-nowrap"
          >
            Bánh kẹo
          </button>
          <button
            onclick="filterCategory('Gia vị')"
            class="category-btn px-4 py-2 bg-gray-100 text-gray-600 text-xs font-bold rounded-lg hover:bg-blue-50 transition whitespace-nowrap"
          >
            Gia vị
          </button>
          <button
            onclick="filterCategory('Nước giải khát')"
            class="category-btn px-4 py-2 bg-gray-100 text-gray-600 text-xs font-bold rounded-lg hover:bg-blue-50 transition whitespace-nowrap"
          >
            Nước giải khát
          </button>
          <button
            onclick="filterCategory('Thuốc lá')"
            class="category-btn px-4 py-2 bg-gray-100 text-gray-600 text-xs font-bold rounded-lg hover:bg-blue-50 transition whitespace-nowrap"
          >
            Thuốc lá
          </button>
          <button
            onclick="filterCategory('Mì tôm')"
            class="category-btn px-4 py-2 bg-gray-100 text-gray-600 text-xs font-bold rounded-lg hover:bg-blue-50 transition whitespace-nowrap"
          >
            Mì tôm
          </button>
          <button
            onclick="filterCategory('Dầu gội-xả')"
            class="category-btn px-4 py-2 bg-gray-100 text-gray-600 text-xs font-bold rounded-lg hover:bg-blue-50 transition whitespace-nowrap"
          >
            Dầu gội-xả
          </button>
          <button
            onclick="filterCategory('Dầu ăn')"
            class="category-btn px-4 py-2 bg-gray-100 text-gray-600 text-xs font-bold rounded-lg hover:bg-blue-50 transition whitespace-nowrap"
          >
            Dầu ăn
          </button>
          <button
            onclick="filterCategory('Sữa')"
            class="category-btn px-4 py-2 bg-gray-100 text-gray-600 text-xs font-bold rounded-lg hover:bg-blue-50 transition whitespace-nowrap"
          >
            Sữa
          </button>
        </div>

        <div id="productGrid" class="product-grid"></div>
      </div>

      <div
        class="w-5/12 p-5 bg-gray-50 flex flex-col justify-between shadow-2xl border-l"
      >
        <div class="flex flex-col h-full overflow-hidden">
          <h2
            class="text-xl font-black mb-4 text-gray-800 border-b-2 border-blue-600 pb-2"
          >
            🧾 HÓA ĐƠN
          </h2>
          <input
            type="text"
            id="customerName"
            placeholder="Tên khách hàng..."
            class="w-full p-2 mb-4 text-sm bg-white border rounded shadow-sm focus:ring-2 ring-blue-200 outline-none"
          />
          <div
            id="cartItems"
            class="space-y-2 pr-1 flex-grow overflow-y-auto"
          ></div>
        </div>

        <div class="border-t pt-4 mt-2">
          <div
            class="flex justify-between text-2xl font-black text-blue-900 mb-4 px-1"
          >
            <span>TỔNG:</span>
            <span id="totalAmount">0đ</span>
          </div>
          <div class="p-3 bg-white rounded-xl shadow border border-gray-200">
            <div class="grid grid-cols-4 gap-1 mb-3">
              <button
                onclick="setCash(50000)"
                class="bg-blue-50 text-blue-700 py-1 rounded text-xs font-bold border border-blue-100"
              >
                50k
              </button>
              <button
                onclick="setCash(100000)"
                class="bg-blue-50 text-blue-700 py-1 rounded text-xs font-bold border border-blue-100"
              >
                100k
              </button>
              <button
                onclick="setCash(200000)"
                class="bg-blue-50 text-blue-700 py-1 rounded text-xs font-bold border border-blue-100"
              >
                200k
              </button>
              <button
                onclick="setCash(500000)"
                class="bg-blue-50 text-blue-700 py-1 rounded text-xs font-bold border border-blue-100"
              >
                500k
              </button>
            </div>
            <div
              class="flex items-center bg-gray-50 p-2 rounded-lg border-2 border-gray-200 focus-within:border-green-500"
            >
              <span class="text-gray-400 font-bold mr-2">VNĐ</span>
              <input
                type="number"
                id="cashReceived"
                oninput="calculateChange()"
                class="w-full bg-transparent text-right text-2xl font-black text-green-700 outline-none"
                placeholder="0"
              />
            </div>
            <div
              class="flex justify-between items-center mt-3 pt-2 border-t border-dashed"
            >
              <span class="text-gray-500 font-bold">Tiền thừa:</span>
              <span id="changeDue" class="text-xl font-black text-orange-600"
                >0đ</span
              >
            </div>
          </div>
          <button
            onclick="checkout()"
            class="w-full bg-blue-700 text-white py-4 rounded-xl mt-4 font-bold text-xl hover:bg-blue-800 transition shadow-lg transform active:scale-95"
          >
            XUẤT HÓA ĐƠN
          </button>
        </div>
      </div>
    </div>

    <div
      id="historyPanel"
      class="fixed bottom-4 left-4 w-5/12 p-3 bg-gray-900 bg-opacity-95 text-white hidden z-50 rounded-lg shadow-2xl"
    >
      <h3
        class="font-bold text-xs text-yellow-400 mb-2 border-b border-gray-700 pb-1 uppercase"
      >
        Giao dịch vừa thực hiện
      </h3>
      <div
        id="historyLog"
        class="text-xs max-h-24 overflow-y-auto space-y-1 font-mono"
      ></div>
      <button
        onclick="
          document.getElementById('historyPanel').classList.add('hidden')
        "
        class="mt-2 w-full text-[10px] bg-gray-700 py-1 rounded"
      >
        Đóng
      </button>
    </div>

        },
      ];

      let cart = [];
      let currentTotal = 0;

      function renderProducts(filter = "All") {
        const grid = document.getElementById("productGrid");
        grid.innerHTML = "";

        const filtered = products.filter(
          (p) => filter === "All" || p.category === filter,
        );

        filtered.forEach((p) => {
          grid.innerHTML += `
            <div onclick="addToCart(${p.id})" class="product-card hover:shadow-lg hover:border-blue-500 cursor-pointer group">
              <img src="${p.img}" class="product-image group-hover:scale-105 transition-transform">
              <div class="flex flex-col justify-between flex-grow">
                <p class="card-title">${p.name}</p>
                <p class="card-price">${p.price.toLocaleString()}đ</p>
              </div>
            </div>`;
        });

        document.querySelectorAll(".category-btn").forEach((btn) => {
          if (
            btn.innerText.includes(filter) ||
            (filter === "All" && btn.innerText === "Tất cả")
          ) {
            btn.classList.replace("bg-gray-100", "bg-blue-600");
            btn.classList.replace("text-gray-600", "text-white");
          } else {
            btn.classList.replace("bg-blue-600", "bg-gray-100");
            btn.classList.replace("text-white", "text-gray-600");
          }
        });
      }

      function addToCart(id) {
        const product = products.find((p) => p.id === id);
        const item = cart.find((c) => c.id === id);
        if (item) item.qty++;
        else cart.push({ ...product, qty: 1 });
        renderCart();
      }

      function updateQty(id, delta) {
        const item = cart.find((c) => c.id === id);
        if (item) {
          item.qty += delta;
          if (item.qty <= 0) cart = cart.filter((c) => c.id !== id);
        }
        renderCart();
      }

      function renderCart() {
        const container = document.getElementById("cartItems");
        const totalEl = document.getElementById("totalAmount");
        if (cart.length === 0) {
          container.innerHTML =
            '<div class="flex flex-col items-center justify-center h-64 text-gray-300"><span class="text-4xl">🛒</span><p class="text-xs italic">Giỏ hàng trống</p></div>';
          totalEl.innerText = "0đ";
          currentTotal = 0;
          calculateChange();
          return;
        }
        container.innerHTML = "";
        let total = 0;
        cart.forEach((item) => {
          total += item.price * item.qty;
          container.innerHTML += `
            <div class="flex justify-between items-center bg-white p-2 rounded-lg shadow-sm border-l-4 border-blue-500 text-sm">
              <div class="flex-1 truncate mr-2">
                <p class="font-bold text-gray-800 truncate">${item.name}</p>
                <p class="text-xs text-blue-500 font-mono">${item.price.toLocaleString()}đ x ${item.qty}</p>
              </div>
              <div class="flex items-center gap-1 bg-gray-100 p-1 rounded">
                <button onclick="updateQty(${item.id}, -1)" class="w-6 h-6 flex items-center justify-center bg-white rounded shadow text-red-500 font-bold">-</button>
                <span class="w-5 text-center font-bold text-xs">${item.qty}</span>
                <button onclick="updateQty(${item.id}, 1)" class="w-6 h-6 flex items-center justify-center bg-white rounded shadow text-green-500 font-bold">+</button>
              </div>
            </div>`;
        });
        currentTotal = total;
        totalEl.innerText = total.toLocaleString() + "đ";
        calculateChange();
      }

      function calculateChange() {
        const cash =
          parseInt(document.getElementById("cashReceived").value) || 0;
        const changeEl = document.getElementById("changeDue");
        if (currentTotal > 0 && cash >= currentTotal) {
          changeEl.innerText = (cash - currentTotal).toLocaleString() + "đ";
          changeEl.style.color = "#ea580c";
        } else if (currentTotal > 0 && cash > 0) {
          changeEl.innerText =
            "Thiếu " + (currentTotal - cash).toLocaleString() + "đ";
          changeEl.style.color = "#dc2626";
        } else {
          changeEl.innerText = "0đ";
        }
      }

      function filterCategory(cat) {
        renderProducts(cat);
      }
      function setCash(amount) {
        document.getElementById("cashReceived").value = amount;
        calculateChange();
      }

      function checkout() {
        if (cart.length === 0) return;
        const cash =
          parseInt(document.getElementById("cashReceived").value) || 0;
        if (cash < currentTotal) return alert("Tiền khách đưa chưa đủ!");
        const customer =
          document.getElementById("customerName").value || "Khách lẻ";
        const now = new Date().toLocaleString("vi-VN");
        document.getElementById("historyPanel").classList.remove("hidden");
        const history = document.getElementById("historyLog");
        history.innerHTML =
          `<div>[${now}] ${customer}: ${currentTotal.toLocaleString()}đ</div>` +
          history.innerHTML;
        alert("Thanh toán thành công!");
        cart = [];
        document.getElementById("cashReceived").value = "";
        document.getElementById("customerName").value = "";
        renderCart();
      }

      document.getElementById("searchInput").addEventListener("input", (e) => {
        const val = e.target.value.toLowerCase();
        const grid = document.getElementById("productGrid");
        grid.innerHTML = "";
        products
          .filter((p) => p.name.toLowerCase().includes(val))
          .forEach((p) => {
            grid.innerHTML += `
            <div onclick="addToCart(${p.id})" class="product-card hover:shadow-lg hover:border-blue-500 cursor-pointer group">
              <img src="${p.img}" class="product-image group-hover:scale-105 transition-transform">
              <div class="flex flex-col justify-between flex-grow">
                <p class="card-title">${p.name}</p>
                <p class="card-price">${p.price.toLocaleString()}đ</p>
              </div>
            </div>`;
          });
      });

      renderProducts("All");

      window.addEventListener("load", function () {
        setTimeout(function () {
          const splash = document.getElementById("splash-screen");
          splash.style.opacity = "0";
          setTimeout(() => {
            splash.style.display = "none";
          }, 500);
        }, 500);
      });
    </script>
  </body>
</html>
